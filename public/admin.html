<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NISHAD BRAND Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="wrap"><div class="admin-head"><div><span class="admin-tag">NISHAD BRAND</span><h1>Admin Panel</h1><p>Manage IDs, rates, QR & store settings</p></div></div><section id="login"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="msg"></div></section><div id="panel" class="hidden"><button onclick="logout()">Logout</button><div id="dash"></div><h2>Rates / WhatsApp</h2><p><b>Price per ID</b> सेट करें। उदाहरण: ₹2 रखने पर 2 ID = ₹4, 5 ID = ₹10, 100 ID = ₹200 अपने-आप होगा।<div id="settings"></div><button onclick="saveSettings()">Save Settings</button><h2>Add IDs</h2><p>हर line: <b>ID | Password | Extra</b></p><textarea id="ids" rows="8" placeholder="user1 | pass1\nuser2 | pass2"></textarea><button onclick="addIDs()">Add Inventory</button><h2>Logo / QR Change</h2><form id="assets"><input type="file" name="logo" accept="image/*"><input type="file" name="qr" accept="image/*"><button>Upload</button></form><h2>Orders & Inventory</h2><div id="tables"></div></div></div><script src="admin.js"></script></body></html>
